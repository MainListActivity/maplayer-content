<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 低饱和闪回：黑白/灰，黎明号旧影像与深空剪影专用 -->
  <defs>
    <radialGradient id="voidGray" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.45" stop-color="#222222"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="shipBody" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="0.5" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <radialGradient id="iceGiant" cx="0.72" cy="0.28" r="0.35">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="0.55" stop-color="#3c3c3c"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="rqFb">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="g"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.18 0" in="g" result="g2"/>
      <feBlend in="SourceGraphic" in2="g2" mode="overlay"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#voidGray)"/>
  <g filter="url(#grain)">
    <g filter="url(#rqFb)">
      <!-- 灰阶星野 -->
      <g fill="#c8c8c8" opacity="0.65">
        <circle cx="140" cy="100" r="1.8"/><circle cx="320" cy="180" r="1.3"/><circle cx="480" cy="60" r="2"/><circle cx="700" cy="140" r="1.4"/>
        <circle cx="1100" cy="80" r="1.6"/><circle cx="1280" cy="200" r="1.2"/><circle cx="1500" cy="50" r="1.9"/><circle cx="1680" cy="160" r="1.5"/>
        <circle cx="200" cy="360" r="1.4"/><circle cx="560" cy="300" r="1.1"/><circle cx="860" cy="90" r="1.7"/><circle cx="1760" cy="380" r="1.3"/>
        <circle cx="100" cy="700" r="1.2"/><circle cx="400" cy="820" r="1.5"/><circle cx="1600" cy="760" r="1.4"/><circle cx="1800" cy="620" r="1.6"/>
      </g>
      <!-- 远景冰巨星（灰） -->
      <circle cx="1480" cy="260" r="220" fill="url(#iceGiant)" opacity="0.7"/>
      <g fill="none" stroke="#555555" stroke-width="3" opacity="0.35">
        <ellipse cx="1480" cy="260" rx="260" ry="40"/>
        <ellipse cx="1480" cy="260" rx="300" ry="55"/>
      </g>
      <!-- 黎明号船体剪影（殖民船） -->
      <g fill="url(#shipBody)" stroke="#6a6a6a" stroke-width="5" stroke-linejoin="round">
        <!-- 主船体 -->
        <path d="M420 520 L780 460 L1180 480 L1280 540 L1180 600 L780 620 L420 560Z"/>
        <!-- 前锥 -->
        <path d="M1180 480 L1380 530 L1280 540Z" fill="#3a3a3a"/>
        <!-- 尾部推进舱 -->
        <path d="M420 520 L320 500 L280 540 L320 580 L420 560Z" fill="#2a2a2a"/>
        <!-- 居住环暗示 -->
        <ellipse cx="700" cy="540" rx="90" ry="70" fill="none" stroke="#7a7a7a" stroke-width="6"/>
        <ellipse cx="900" cy="545" rx="70" ry="55" fill="none" stroke="#7a7a7a" stroke-width="5"/>
      </g>
      <!-- 舷窗微光（极淡灰白） -->
      <g fill="#b0b0b0" opacity="0.55">
        <circle cx="560" cy="530" r="4"/><circle cx="620" cy="525" r="3.5"/><circle cx="680" cy="522" r="4"/>
        <circle cx="800" cy="518" r="3.5"/><circle cx="860" cy="520" r="4"/><circle cx="980" cy="525" r="3.5"/>
        <circle cx="1080" cy="530" r="4"/><circle cx="1140" cy="535" r="3"/>
      </g>
      <!-- 搜救灯熄灭后的残光（稀疏、冷灰） -->
      <g fill="#9a9a9a" opacity="0.25">
        <circle cx="500" cy="400" r="3"/><circle cx="640" cy="380" r="2"/><circle cx="1100" cy="390" r="2.5"/>
        <circle cx="1240" cy="420" r="2"/><circle cx="900" cy="360" r="1.8"/>
      </g>
      <!-- 旧影像彩带/人群残影（极淡，启航日记忆） -->
      <g fill="none" stroke="#888888" stroke-width="2" opacity="0.22">
        <path d="M360 700 Q480 640 600 720"/><path d="M700 740 Q820 660 940 730"/><path d="M1000 720 Q1120 650 1240 710"/>
      </g>
      <g fill="#7a7a7a" opacity="0.18">
        <circle cx="420" cy="760" r="8"/><circle cx="480" cy="770" r="6"/><circle cx="540" cy="755" r="7"/>
        <circle cx="780" cy="780" r="6"/><circle cx="840" cy="770" r="8"/><circle cx="900" cy="785" r="5"/>
        <circle cx="1080" cy="765" r="7"/><circle cx="1140" cy="775" r="6"/><circle cx="1200" cy="760" r="5"/>
      </g>
      <!-- 底部暗区，保留构图重心 -->
      <path d="M0 880 L1920 880 L1920 1080 L0 1080Z" fill="#080808" opacity="0.7"/>
      <!-- 胶片边框感 -->
      <g fill="none" stroke="#1a1a1a" stroke-width="24" opacity="0.8">
        <rect x="12" y="12" width="1896" height="1056"/>
      </g>
      <g fill="#4a4a4a" opacity="0.4">
        <rect x="40" y="40" width="18" height="12" rx="2"/><rect x="80" y="40" width="18" height="12" rx="2"/><rect x="120" y="40" width="18" height="12" rx="2"/>
        <rect x="1780" y="40" width="18" height="12" rx="2"/><rect x="1820" y="40" width="18" height="12" rx="2"/><rect x="1860" y="40" width="18" height="12" rx="2"/>
        <rect x="40" y="1028" width="18" height="12" rx="2"/><rect x="80" y="1028" width="18" height="12" rx="2"/><rect x="120" y="1028" width="18" height="12" rx="2"/>
        <rect x="1780" y="1028" width="18" height="12" rx="2"/><rect x="1820" y="1028" width="18" height="12" rx="2"/><rect x="1860" y="1028" width="18" height="12" rx="2"/>
      </g>
    </g>
  </g>
</svg>
