<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="earth" cx="0.5" cy="1.35" r="1.1">
      <stop offset="0" stop-color="#3e7fae"/>
      <stop offset="0.35" stop-color="#1d4d75"/>
      <stop offset="0.6" stop-color="#0c2237"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a26"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3048"/>
      <stop offset="1" stop-color="#0c1420"/>
    </linearGradient>
    <filter id="rq3"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#070a12"/>
  <g filter="url(#rq3)">
    <!-- 舷窗外地球弧 -->
    <path d="M160 120 Q960 40 1760 120 L1760 620 Q960 700 160 620Z" fill="url(#earth)" stroke="#2a3648" stroke-width="10"/>
    <!-- 星点 -->
    <g fill="#e8f4ff" opacity="0.8">
      <circle cx="320" cy="210" r="2.4"/><circle cx="520" cy="160" r="1.8"/><circle cx="760" cy="240" r="2"/><circle cx="1050" cy="170" r="2.6"/><circle cx="1330" cy="230" r="1.8"/><circle cx="1560" cy="180" r="2.2"/><circle cx="900" cy="140" r="1.6"/><circle cx="1200" cy="300" r="1.6"/>
      <circle cx="440" cy="280" r="1.4"/><circle cx="680" cy="190" r="1.5"/><circle cx="1480" cy="260" r="1.7"/>
    </g>
    <!-- 窗框与结构梁 -->
    <path d="M300 560 Q960 500 1620 560 L1620 640 Q960 700 300 640Z" fill="#0a1626" opacity="0.85"/>
    <path d="M200 620 Q960 690 1720 620 L1720 700 Q960 790 200 700Z" fill="#10151f"/>
    <g stroke="#2a3648" stroke-width="5" fill="none" opacity="0.55">
      <path d="M480 130 L480 600"/><path d="M960 80 L960 640"/><path d="M1440 130 L1440 600"/>
      <path d="M200 320 L1720 320"/>
    </g>
    <!-- 甲板 -->
    <rect x="0" y="660" width="1920" height="420" fill="url(#deck)"/>
    <g stroke="#1c2436" stroke-width="3" opacity="0.5">
      <path d="M80 780 L1840 780"/><path d="M120 900 L1800 900"/>
    </g>
    <!-- 左右侧台 + 中央值守台 -->
    <g stroke="#232d42" stroke-width="6" fill="#111827">
      <path d="M300 700 L560 700 L620 860 L260 860Z"/>
      <path d="M1360 700 L1620 700 L1660 860 L1300 860Z"/>
      <path d="M700 720 L1220 720 L1270 900 L650 900Z"/>
    </g>
    <!-- 台面细节：旋钮区 / 屏幕 / 手写标签感 -->
    <g fill="url(#panelGlow)" stroke="#2a3648" stroke-width="3">
      <rect x="330" y="720" width="200" height="70" rx="6"/>
      <rect x="1400" y="720" width="200" height="70" rx="6"/>
      <rect x="760" y="740" width="400" height="90" rx="8"/>
    </g>
    <g fill="#ffd27a">
      <circle cx="420" cy="740" r="6"/><circle cx="470" cy="740" r="6" opacity="0.6"/><circle cx="1480" cy="740" r="6"/>
      <circle cx="1520" cy="745" r="5" opacity="0.5"/><circle cx="370" cy="755" r="4" opacity="0.7"/>
      <circle cx="520" cy="755" r="4" opacity="0.45"/><circle cx="1570" cy="755" r="4" opacity="0.55"/>
    </g>
    <!-- 频段条 -->
    <g fill="#3aa6a0">
      <rect x="780" y="760" width="90" height="14" rx="7" opacity="0.85"/>
      <rect x="890" y="760" width="40" height="14" rx="7" opacity="0.5"/>
      <rect x="950" y="760" width="70" height="14" rx="7" opacity="0.35"/>
      <rect x="1050" y="760" width="120" height="14" rx="7" opacity="0.7"/>
    </g>
    <g fill="#2a6a78" opacity="0.6">
      <rect x="780" y="790" width="55" height="10" rx="5"/>
      <rect x="850" y="790" width="80" height="10" rx="5"/>
      <rect x="950" y="790" width="35" height="10" rx="5"/>
      <rect x="1010" y="790" width="100" height="10" rx="5"/>
    </g>
    <!-- 中央立柱 / 全息座 -->
    <rect x="930" y="690" width="60" height="180" rx="8" fill="#0d1220" stroke="#232d42" stroke-width="5"/>
    <ellipse cx="960" cy="690" rx="46" ry="12" fill="#4aa8c0" opacity="0.4"/>
    <ellipse cx="960" cy="685" rx="28" ry="6" fill="#6ec8d8" opacity="0.25"/>
    <!-- 透视引导线 -->
    <g stroke="#2a3648" stroke-width="4" fill="none" opacity="0.7">
      <path d="M0 700 L260 860"/><path d="M1920 700 L1660 860"/><path d="M700 720 L650 900"/><path d="M1220 720 L1270 900"/>
    </g>
    <!-- 天花板灯带暗示 -->
    <g fill="#4aa8c0" opacity="0.15">
      <rect x="400" y="100" width="240" height="8" rx="4"/>
      <rect x="840" y="70" width="240" height="8" rx="4"/>
      <rect x="1280" y="100" width="240" height="8" rx="4"/>
    </g>
  </g>
</svg>
