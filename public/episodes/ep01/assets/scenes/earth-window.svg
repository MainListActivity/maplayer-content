<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="nightEarth" cx="0.48" cy="0.62" r="0.72">
      <stop offset="0" stop-color="#1a3a58"/>
      <stop offset="0.4" stop-color="#0e2438"/>
      <stop offset="0.75" stop-color="#081420"/>
      <stop offset="1" stop-color="#03060c"/>
    </radialGradient>
    <radialGradient id="atmRim" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0.72" stop-color="#4a90b8" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#6ab0d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8ec8e0" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <filter id="rqEw"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#04070e"/>
  <g filter="url(#rqEw)">
    <!-- 深空背景星点 -->
    <g fill="#dceeff" opacity="0.7">
      <circle cx="120" cy="80" r="1.6"/><circle cx="280" cy="140" r="1.2"/><circle cx="1600" cy="60" r="1.8"/><circle cx="1780" cy="180" r="1.4"/>
      <circle cx="80" cy="320" r="1.3"/><circle cx="1840" cy="400" r="1.5"/><circle cx="200" cy="500" r="1.1"/>
    </g>
    <!-- 地球夜半球 -->
    <ellipse cx="960" cy="620" rx="780" ry="520" fill="url(#nightEarth)"/>
    <ellipse cx="960" cy="620" rx="780" ry="520" fill="url(#atmRim)"/>
    <!-- 稀疏灯网（战后续存城市） -->
    <g fill="#ffd89a" opacity="0.85">
      <circle cx="620" cy="480" r="2.2"/><circle cx="660" cy="500" r="1.6"/><circle cx="700" cy="470" r="1.8"/>
      <circle cx="740" cy="520" r="1.4"/><circle cx="780" cy="490" r="2"/><circle cx="820" cy="540" r="1.5"/>
      <circle cx="880" cy="510" r="1.7"/><circle cx="920" cy="560" r="2.4"/><circle cx="960" cy="530" r="1.6"/>
      <circle cx="1000" cy="580" r="1.8"/><circle cx="1040" cy="500" r="2"/><circle cx="1080" cy="550" r="1.4"/>
      <circle cx="1120" cy="520" r="1.9"/><circle cx="1160" cy="570" r="1.5"/><circle cx="1200" cy="490" r="2.1"/>
      <circle cx="1240" cy="540" r="1.3"/><circle cx="1280" cy="510" r="1.7"/><circle cx="1320" cy="560" r="1.4"/>
      <circle cx="560" cy="560" r="1.5"/><circle cx="1360" cy="580" r="1.6"/>
      <circle cx="680" cy="620" r="1.2"/><circle cx="840" cy="640" r="1.8"/><circle cx="1100" cy="630" r="1.4"/>
      <circle cx="980" cy="680" r="1.3"/><circle cx="720" cy="700" r="1.1"/><circle cx="1180" cy="690" r="1.5"/>
    </g>
    <!-- 更淡的灯带连线感 -->
    <g stroke="#ffd89a" stroke-width="1.2" opacity="0.25" fill="none">
      <path d="M620 480 L700 470 L780 490 L920 560 L1040 500 L1200 490 L1320 560"/>
      <path d="M660 500 L820 540 L1000 580 L1160 570"/>
    </g>
    <!-- 大陆暗影轮廓暗示 -->
    <g fill="#061018" opacity="0.35">
      <path d="M480 640 Q640 560 820 600 Q960 640 1100 590 Q1280 540 1440 620 Q1320 760 960 780 Q620 760 480 640Z"/>
    </g>
    <!-- 厚舷窗框 -->
    <g fill="none" stroke="#2a3648" stroke-width="28">
      <ellipse cx="960" cy="480" rx="820" ry="400"/>
    </g>
    <g fill="none" stroke="#1a2434" stroke-width="12">
      <ellipse cx="960" cy="480" rx="780" ry="370"/>
    </g>
    <!-- 窗框铆钉与分割 -->
    <g fill="#3a4a60">
      <circle cx="200" cy="480" r="8"/><circle cx="1720" cy="480" r="8"/>
      <circle cx="960" cy="120" r="8"/><circle cx="960" cy="840" r="8"/>
      <circle cx="360" cy="220" r="6"/><circle cx="1560" cy="220" r="6"/>
      <circle cx="360" cy="740" r="6"/><circle cx="1560" cy="740" r="6"/>
    </g>
    <g stroke="#2a3648" stroke-width="6" opacity="0.6" fill="none">
      <path d="M960 110 L960 850"/>
      <path d="M220 480 L1700 480"/>
    </g>
    <!-- 窗台 / 站立地面 -->
    <path d="M0 860 L1920 860 L1920 1080 L0 1080Z" fill="url(#sill)"/>
    <path d="M80 860 Q960 820 1840 860 L1840 900 Q960 860 80 900Z" fill="#121820" stroke="#2a3648" stroke-width="5"/>
    <g stroke="#1c2838" stroke-width="3" opacity="0.45">
      <path d="M120 960 L1800 960"/>
    </g>
  </g>
</svg>
