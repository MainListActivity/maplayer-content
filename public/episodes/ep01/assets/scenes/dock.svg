    <circle cx="1680" cy="500" r="9" fill="#e04a4a" stroke="none" opacity="0.6"/>
    <!-- 三号泊位对接环（远景，可转动感） -->
    <g fill="none" stroke="#4a6a88" stroke-width="6" opacity="0.9">
      <ellipse cx="960" cy="480" rx="220" ry="90"/>
      <ellipse cx="960" cy="480" rx="160" ry="60"/>
    </g>
    <g fill="#ffd27a" stroke="none" opacity="0.85">
      <circle cx="740" cy="480" r="5"/><circle cx="1180" cy="480" r="5"/>
      <circle cx="960" cy="390" r="5"/><circle cx="960" cy="570" r="5"/>
      <circle cx="820" cy="420" r="3.5"/><circle cx="1100" cy="420" r="3.5"/>
      <circle cx="820" cy="540" r="3.5"/><circle cx="1100" cy="540" r="3.5"/>
    </g>
    <!-- 引导桁架 -->
    <path d="M560 470 L1260 470 L1260 500 L560 500Z" fill="#131b2b" opacity="0.9"/>
    <g fill="#ffd27a" stroke="none" opacity="0.9">
