<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="dk" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#122036"/>
      <stop offset="1" stop-color="#04060c"/>
    </radialGradient>
    <filter id="rq5"><feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#dk)"/>
  <!-- 星野 -->
  <g fill="#e8f4ff" opacity="0.75">
    <circle cx="180" cy="140" r="2"/><circle cx="480" cy="90" r="1.6"/><circle cx="820" cy="180" r="2.2"/><circle cx="1200" cy="100" r="1.8"/><circle cx="1500" cy="220" r="2.4"/><circle cx="1740" cy="120" r="1.7"/><circle cx="240" cy="420" r="1.8"/><circle cx="1650" cy="460" r="2"/>
    <circle cx="360" cy="260" r="1.4"/><circle cx="980" cy="60" r="1.5"/><circle cx="1400" cy="160" r="1.3"/><circle cx="600" cy="340" r="1.6"/>
  </g>
  <g filter="url(#rq5)" stroke="#31415c" stroke-width="7" stroke-linejoin="round">
    <!-- 左侧站体结构 -->
    <path d="M240 620 L240 380 L420 320 L420 620Z" fill="#0d1420"/>
