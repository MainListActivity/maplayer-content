name: Engine checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:performance
        env:
          PERFORMANCE_EVIDENCE_DIR: ${{ runner.temp }}/performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-mechanisms
          path: ${{ runner.temp }}/performance
          if-no-files-found: ignore
